spring.application.name=sosd-backend

# GitHub가 삭제/비공개 저장소 모두에 NOT_FOUND를 줄 수 있으므로 연속 확인 후 제외한다.
github.collector.repository-unavailable-threshold=${GITHUB_REPOSITORY_UNAVAILABLE_THRESHOLD:3}

# ?? ??? ??
spring.profiles.active=intellij

# JPA / Hibernate ?? ??
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SQL ???? ??? Hibernate validate ?? ??
spring.jpa.defer-datasource-initialization=true

# ?? ??
server.port=8080
