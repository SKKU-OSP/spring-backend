# ?? MySQL ?? ?? (??? ??)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sosd_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:sosd_user}
spring.datasource.password=${MYSQL_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL ???? ??? Hibernate validate ?? ??
spring.jpa.defer-datasource-initialization=true

# SQL ??? ??
spring.sql.init.mode=never
spring.sql.init.schema-locations=\
  classpath:schema/user-schema.sql,\
  classpath:schema/github-schema.sql,\
  classpath:schema/github-score-schema.sql,\
  classpath:schema/aggregation-schema.sql

spring.sql.init.data-locations=classpath:data/dev-seed.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.sql.init.separator=;
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# 로컬 실행 시 GitHub 수집 스케줄러 비활성화 (개발 서버 DB 보호)
scheduling.github.enabled=false
# ??
# ???? ??? ?? ?? ?? ? ???? ??? ?? -> ? ? ????? ??
spring.jpa.hibernate.ddl-auto=none

# ??? ??? ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.com.zaxxer.hikari=DEBUG


# .env ?? ????
spring.config.import=\
  optional:file:./.env[.properties],\
  optional:file:../.env[.properties],\
  optional:file:./.env.local[.properties]

# github.token ????? .env ?? ??
github.token=${GITHUB_TOKEN}

# --------------------------------------------------
# Logging ?? (?? ??)
# --------------------------------------------------

logging.file.name=./logs/sosd-backend.log
logging.logback.rollingpolicy.max-file-size=500MB
logging.logback.rollingpolicy.max-history=30